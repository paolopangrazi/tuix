name: Release

on:
  push:
    tags: ['v*']

# Least privilege by default: only the publish job below opts into write.
permissions:
  contents: read

# Serialize per tag, but never cancel — a half-published release is worse than
# a duplicate run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported runner (glibc 2.35) and with the C++
          # runtime linked in statically, so the binary also runs on distros
          # older than the builder — glibc is forward- but not backward-
          # compatible. Do NOT move these to ubuntu-latest.
          - os: ubuntu-22.04
            target: linux-x86_64
            cmake_args: '"-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"'
          # Native arm64 runner (free for public repos) — no cross-toolchain,
          # no emulation.
          - os: ubuntu-22.04-arm
            target: linux-arm64
            cmake_args: '"-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"'
          # One fat binary covering Apple Silicon and Intel Macs: the runner is
          # arm64, so x86_64 is a cross-compile (hence no test run here).
          - os: macos-latest
            target: macos-universal
            # Quoted: the `;` would otherwise be a shell command separator.
            cmake_args: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"'
          - os: windows-latest
            target: windows-x86_64

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Tests are built here too: the release flags (static libstdc++, the
      # universal-binary arch list) differ from CI's, so the suite has to run
      # against the configuration we actually ship.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DTUIX_BUILD_TESTS=ON ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --parallel --config Release

      # On macOS this exercises the arm64 slice (the runner's own arch); the
      # cross-compiled x86_64 slice can't be executed here.
      - name: Test
        run: ctest --test-dir build --output-on-failure --build-config Release

      # Guard against a silently single-arch build (e.g. a dep forcing the
      # host arch): the release artifact must carry both slices.
      - name: Verify universal binary
        if: matrix.target == 'macos-universal'
        run: |
          lipo -info build/tuix
          lipo -archs build/tuix | grep -q arm64
          lipo -archs build/tuix | grep -q x86_64

      # The portability promise, enforced: no libstdc++/libgcc_s dependency,
      # and no glibc symbol newer than 2.35 (Ubuntu 22.04 / Debian 12 / RHEL 9).
      - name: Verify Linux portability
        if: runner.os == 'Linux'
        run: |
          ldd build/tuix
          if ldd build/tuix | grep -E 'libstdc\+\+|libgcc_s'; then
            echo "::error::binary still links the shared C++ runtime"
            exit 1
          fi
          max=$(objdump -T build/tuix \
                | grep -oE 'GLIBC_2\.[0-9]+' | sort -uV | tail -1)
          echo "highest glibc symbol required: $max"
          if [ "$(printf '%s\nGLIBC_2.35\n' "$max" | sort -V | tail -1)" != "GLIBC_2.35" ]; then
            echo "::error::requires $max, above the 2.35 floor"
            exit 1
          fi

      # --component tuix: ship the binary alone, not the vendored deps'
      # headers and static libs (see the install() rule in CMakeLists.txt).
      - name: Stage install
        run: cmake --install build --config Release --component tuix --prefix "stage/tuix-${{ github.ref_name }}-${{ matrix.target }}"

      # Unix ships a .tar.gz; Windows ships a .zip (friendlier to unpack there).
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: tar -czf "tuix-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" -C stage "tuix-${{ github.ref_name }}-${{ matrix.target }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "stage/tuix-${{ github.ref_name }}-${{ matrix.target }}" -DestinationPath "tuix-${{ github.ref_name }}-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuix-${{ github.ref_name }}-${{ matrix.target }}
          path: |
            tuix-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            tuix-${{ github.ref_name }}-${{ matrix.target }}.zip
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job creates the GitHub release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum *.tar.gz *.zip > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS
          generate_release_notes: true
