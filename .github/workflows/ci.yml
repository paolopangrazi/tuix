name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          # macOS uses Apple Clang by default; gcc adds little value here
          - os: macos-latest
            compiler: clang
          # Windows uses MSVC (a multi-config generator)
          - os: windows-latest
            compiler: msvc

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set compiler env (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang"  >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc"  >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DTUIX_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure --build-config Release

      # Single-config generators (Make/Ninja) drop the binary in build/; the
      # MSVC multi-config generator puts it in build/Release/.
      - name: Verify binary (Unix)
        if: runner.os != 'Windows'
        run: test -x ./build/tuix

      - name: Verify binary (Windows)
        if: runner.os == 'Windows'
        run: if (-not (Test-Path ./build/Release/tuix.exe)) { exit 1 }

      - name: Test install (Unix)
        if: runner.os != 'Windows'
        run: cmake --install build --config Release --prefix "$RUNNER_TEMP/install" && test -x "$RUNNER_TEMP/install/bin/tuix"

      - name: Test install (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake --install build --config Release --prefix "$env:RUNNER_TEMP/install"
          if (-not (Test-Path "$env:RUNNER_TEMP/install/bin/tuix.exe")) { exit 1 }
