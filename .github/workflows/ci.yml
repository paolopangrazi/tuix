name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the in-flight run obsolete — drop it
# rather than paying for a full 5-platform matrix twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          # Native arm64: the release ships a linux-arm64 binary, so the tests
          # need to run on that arch before a tag is cut.
          - os: ubuntu-24.04-arm
            compiler: gcc
          # macOS uses Apple Clang by default; gcc adds little value here
          - os: macos-latest
            compiler: clang
          # Windows uses MSVC (a multi-config generator)
          - os: windows-latest
            compiler: msvc

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set compiler env (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang"  >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc"  >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi

      # TUIX_WERROR is CI-only: our own sources must stay warning-free (the
      # vendored deps are exempt — the flag is PRIVATE to tuix_core).
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DTUIX_BUILD_TESTS=ON -DTUIX_WERROR=ON

      - name: Build
        run: cmake --build build --parallel --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure --build-config Release

      # Single-config generators (Make/Ninja) drop the binary in build/; the
      # MSVC multi-config generator puts it in build/Release/.
      - name: Verify binary (Unix)
        if: runner.os != 'Windows'
        run: test -x ./build/tuix

      - name: Verify binary (Windows)
        if: runner.os == 'Windows'
        run: if (-not (Test-Path ./build/Release/tuix.exe)) { exit 1 }

      # tuix_tests links tuix_core, *not* main.cpp — without this step the
      # executable's own arg handling and the headless entry point ship with no
      # CI coverage at all. bash on the Windows runner is git-bash.
      - name: Smoke test the binary
        shell: bash
        run: |
          bin=./build/tuix
          [ -x "$bin" ] || bin=./build/Release/tuix.exe
          "$bin" --version
          "$bin" --help > /dev/null

          # The documented pipeline order (filter → sort → head → select),
          # end to end through argv rather than through the unit-test fakes.
          got=$("$bin" --filter 'salary > 50000' --sort 'department,salary desc' \
                       --select first_name,department --head 1 \
                       samples/csv/employees.csv | tr -d '\r')
          want=$'first_name,department\nIvan,Data'
          if [ "$got" != "$want" ]; then
            echo "::error::headless pipeline output changed"
            printf 'want:\n%s\ngot:\n%s\n' "$want" "$got"
            exit 1
          fi

          # stdin → stdout, the other half of the filter contract.
          rows=$("$bin" --head 2 < samples/csv/employees.csv | wc -l)
          [ "$rows" -eq 3 ] || { echo "::error::stdin path returned $rows lines, want 3"; exit 1; }

          # A bad column must fail loudly, not emit a half-transformed sheet.
          if "$bin" --sort nosuchcol samples/csv/employees.csv > /dev/null 2>&1; then
            echo "::error::an unknown --sort column should exit non-zero"
            exit 1
          fi

      - name: Test install (Unix)
        if: runner.os != 'Windows'
        run: cmake --install build --config Release --component tuix --prefix "$RUNNER_TEMP/install" && test -x "$RUNNER_TEMP/install/bin/tuix"

      - name: Test install (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake --install build --config Release --component tuix --prefix "$env:RUNNER_TEMP/install"
          if (-not (Test-Path "$env:RUNNER_TEMP/install/bin/tuix.exe")) { exit 1 }
